<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <!-- PWA / App -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0a0a12" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="NightMatch" />

    <!-- iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NightMatch" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icon-152.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />

    <!-- SEO -->
    <title>NightMatch | מאצ'ים בזמן אמת</title>
    <meta name="description" content="מאצ'ים בזמן אמת — רק עם אנשים שכבר בחוץ הלילה. סרוק QR, סווייפ, התאחד." />
    <meta name="keywords" content="nightmatch, dating, nightlife, tel aviv, swipe, match, bar, club" />

    <!-- Open Graph (for sharing on WhatsApp, Facebook, etc.) -->
    <meta property="og:title" content="NightMatch 🌙" />
    <meta property="og:description" content="מאצ'ים בזמן אמת — רק עם מי שכבר שם 🔥" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://nightmatch-34424.web.app" />
    <meta property="og:image" content="https://nightmatch-34424.web.app/icon-512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:locale" content="he_IL" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="NightMatch 🌙" />
    <meta name="twitter:description" content="Real-time matches at your venue — only with people already there 🔥" />
    <meta name="twitter:image" content="https://nightmatch-34424.web.app/icon-512.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <style>
      /* Critical: prevent flash of unstyled content */
      html, body { background: #0a0a12; margin: 0; padding: 0; }
      /* Prevent iOS bounce/overscroll on the root */
      body { overscroll-behavior: none; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
