<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NightMatch — אין חיבור</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0a0a12;
      font-family: 'Heebo', system-ui, sans-serif;
      color: #fff;
      text-align: center;
      padding: 2rem;
    }
    .emoji { font-size: 4rem; margin-bottom: 1.5rem; animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
    h1 { font-size: 1.5rem; font-weight: 900; margin-bottom: 0.5rem; }
    p { color: rgba(255,255,255,0.4); font-size: 0.875rem; line-height: 1.6; max-width: 280px; margin-bottom: 2rem; }
    button {
      padding: 0.875rem 2rem;
      border-radius: 1rem;
      border: none;
      font-size: 0.875rem;
      font-weight: 700;
      color: #fff;
      cursor: pointer;
      background: linear-gradient(135deg, hsl(290,100%,55%), hsl(320,100%,50%));
      box-shadow: 0 0 20px hsl(290,100%,65%,0.3);
    }
  </style>
</head>
<body>
  <div class="emoji">🌙</div>
  <h1>אין חיבור לאינטרנט</h1>
  <p>NightMatch דורש חיבור פעיל כדי להציג פרופילים ומאצ׳ים בזמן אמת.</p>
  <button onclick="window.location.reload()">🔄 נסה שוב</button>
</body>
</html>
